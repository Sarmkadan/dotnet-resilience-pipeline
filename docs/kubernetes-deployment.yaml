# Kubernetes Deployment Manifests for DotNet Resilience Pipeline
# Apply with: kubectl apply -f kubernetes-deployment.yaml

---
apiVersion: v1
kind: Namespace
metadata:
  name: resilience
  labels:
    name: resilience

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resilience-config
  namespace: resilience
data:
  appsettings.json: |
    {
      "CircuitBreaker": {
        "FailureThreshold": 5,
        "OpenDuration": "00:00:30",
        "SuccessThresholdInHalfOpen": 3
      },
      "Retry": {
        "MaxRetries": 3,
        "InitialDelay": "00:00:00.1000000",
        "Strategy": "Exponential",
        "BackoffMultiplier": 2.0,
        "MaxDelay": "00:00:30"
      },
      "Timeout": {
        "Duration": "00:00:10"
      },
      "Bulkhead": {
        "MaxParallelization": 20,
        "MaxQueueLength": 100
      },
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft": "Warning"
        }
      }
    }

---
apiVersion: v1
kind: Secret
metadata:
  name: resilience-secrets
  namespace: resilience
type: Opaque
stringData:
  ConnectionString: "Server=postgres;Database=resilience;Username=postgres;Password=resilience123!;"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilience-pipeline
  namespace: resilience
  labels:
    app: resilience-pipeline
    version: v1
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: resilience-pipeline
  template:
    metadata:
      labels:
        app: resilience-pipeline
        version: v1
    spec:
      serviceAccountName: resilience-pipeline
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: api
        image: sarmkadan/dotnet-resilience-pipeline:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        - name: https
          containerPort: 5001
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:5000"
        - name: DOTNET_EnableDiagnostics
          value: "0"
        - name: ConnectionString
          valueFrom:
            secretKeyRef:
              name: resilience-secrets
              key: ConnectionString
        volumeMounts:
        - name: config
          mountPath: /app/appsettings.json
          subPath: appsettings.json
          readOnly: true
        - name: cache
          mountPath: /tmp/resilience
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 3
          failureThreshold: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: resilience-config
      - name: cache
        emptyDir:
          sizeLimit: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - resilience-pipeline
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: resilience-pipeline
  namespace: resilience
  labels:
    app: resilience-pipeline
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  - port: 443
    targetPort: 5001
    protocol: TCP
    name: https
  selector:
    app: resilience-pipeline

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: resilience-pipeline
  namespace: resilience

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: resilience-pipeline-pdb
  namespace: resilience
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: resilience-pipeline

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resilience-pipeline-hpa
  namespace: resilience
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resilience-pipeline
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resilience-ingress
  namespace: resilience
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.example.com
    secretName: resilience-tls
  rules:
  - host: api.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: resilience-pipeline
            port:
              number: 80

---
apiVersion: v1
kind: NetworkPolicy
metadata:
  name: resilience-network-policy
  namespace: resilience
spec:
  podSelector:
    matchLabels:
      app: resilience-pipeline
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 5000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: resilience-pipeline
  namespace: resilience
spec:
  selector:
    matchLabels:
      app: resilience-pipeline
  endpoints:
  - port: http
    interval: 30s
    path: /metrics

# Usage:
# kubectl apply -f kubernetes-deployment.yaml
#
# Verify deployment:
# kubectl get pods -n resilience
# kubectl get services -n resilience
# kubectl describe deployment resilience-pipeline -n resilience
#
# View logs:
# kubectl logs deployment/resilience-pipeline -n resilience -f
#
# Port forward for local access:
# kubectl port-forward -n resilience svc/resilience-pipeline 5000:80
#
# Delete deployment:
# kubectl delete namespace resilience
