version: '3.8'

services:
  # DotNet Resilience Pipeline Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dotnet-resilience-pipeline
    environment:
      - DOTNET_ENVIRONMENT=Production
      - DOTNET_EnableDiagnostics=0
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - resilience-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: resilience-db
    environment:
      POSTGRES_DB: resilience
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resilience123!}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resilience-network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: resilience-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - resilience-network
    restart: unless-stopped

  # Grafana Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: resilience-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - resilience-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  resilience-network:
    driver: bridge

# Usage:
# docker-compose up -d                          # Start all services
# docker-compose down                           # Stop all services
# docker-compose logs -f app                    # View app logs
# docker-compose exec postgres psql -U postgres # Connect to database
#
# Services:
# - Application: http://localhost:8080
# - Prometheus:   http://localhost:9090
# - Grafana:      http://localhost:3000 (admin/admin)
# - PostgreSQL:   localhost:5432
